<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CampusConnect Heatmap</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css"/>
</head>

<body>
    <div class="container">
        <header>
            <h1>CampusConnect</h1>
            <p>Campus Heatmap Prototype</p>
        </header>
        
        <div class="controls">
            <div class="button-group">
                <button class="filter-btn active" data-filter="all">All Areas</button>
                <button class="filter-btn" data-filter="social">Social</button>
                <button class="filter-btn" data-filter="relax">Relax</button>
                <button class="filter-btn" data-filter="food">Food</button>
                <button class="filter-btn" data-filter="study">Study</button>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Heatmap plugin -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
