<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CampusConnect Heatmap</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>
    <h2>CampusConnect - Heatmap Prototype</h2>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Heatmap plugin (optional for later) -->
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script>
        // Center of University of Deusto Bilbao
        const map = L.map('map').setView([43.2683, -2.9469], 17);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // For now, NO heatmap points (empty map)
        // Add heatmap later like: L.heatLayer(points).addTo(map);

    </script>
</body>
</html>
